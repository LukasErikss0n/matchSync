<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="calBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ecdf2" />
      <stop offset="100%" stop-color="#5eb2e6" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="34" fill="#131c2e" />

  <!-- calendar rings -->
  <rect x="72" y="46" width="12" height="26" rx="6" fill="url(#calBody)" />
  <rect x="116" y="46" width="12" height="26" rx="6" fill="url(#calBody)" />

  <!-- calendar body -->
  <rect x="52" y="66" width="96" height="88" rx="12" fill="url(#calBody)" />

  <!-- header strip -->
  <rect x="52" y="66" width="96" height="24" rx="12" fill="#5eb2e6" />

  <!-- day-cell grid -->
  <g fill="rgba(8,19,31,0.35)">
    <rect x="63" y="100" width="14" height="14" rx="3" />
    <rect x="85" y="100" width="14" height="14" rx="3" />
    <rect x="107" y="100" width="14" height="14" rx="3" />
    <rect x="129" y="100" width="14" height="14" rx="3" />
    <rect x="63" y="122" width="14" height="14" rx="3" />
    <rect x="85" y="122" width="14" height="14" rx="3" />
    <rect x="107" y="122" width="14" height="14" rx="3" />
    <rect x="129" y="122" width="14" height="14" rx="3" />
  </g>

  <!-- lightning streak -->
  <polygon
    points="30,146 118,96 100,108 172,66 96,120 112,110"
    fill="#ffffff"
  />
</svg>
